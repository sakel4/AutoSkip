<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- AutoSkip: a skip-forward glyph inside an "automatic" loop arrow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="0.5" stop-color="#ff2e55"/>
      <stop offset="1" stop-color="#c2136b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#6b0030" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Gradient tile with a soft highlight. -->
  <path d="M38 4 H90 C112 4 124 16 124 38 V90 C124 112 112 124 90 124 H38 C16 124 4 112 4 90 V38 C4 16 16 4 38 4 Z" fill="url(#bg)"/>
  <path d="M38 4 H90 C112 4 124 16 124 38 V90 C124 112 112 124 90 124 H38 C16 124 4 112 4 90 V38 C4 16 16 4 38 4 Z" fill="url(#shine)"/>

  <g fill="#fff" stroke="#fff" filter="url(#shadow)">
    <!-- Loop arrow, clockwise, with its head at the top. -->
    <path d="M98.64 44 A40 40 0 1 1 60.51 24.15" fill="none" stroke-width="7" stroke-linecap="round"/>
    <path d="M72 23.2 L57.2 35.2 L55.6 13.2 Z" stroke-width="3" stroke-linejoin="round"/>

    <!-- Skip-forward glyph. -->
    <path d="M50.5 50 L50.5 78 L70.5 64 Z" stroke-width="8" stroke-linejoin="round"/>
    <rect x="75" y="49" width="7.5" height="30" rx="3.75" stroke-width="0"/>
  </g>
</svg>
